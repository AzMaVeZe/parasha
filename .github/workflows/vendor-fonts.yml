name: Vendor Google Fonts locally

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/parasha-website-kjw9xa

      - name: Download fonts and build local CSS
        run: |
          python3 - <<'EOF'
          import re, os, urllib.request
          css_url = ("https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900"
                     "&family=Heebo:wght@300;400;500;600;700&family=David+Libre:wght@400;500;700&display=swap")
          ua = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          css = urllib.request.urlopen(urllib.request.Request(css_url, headers={"User-Agent": ua})).read().decode()
          os.makedirs("assets/fonts", exist_ok=True)
          def repl(m):
              url = m.group(1)
              parts = url.split("/")
              fname = parts[4] + "-" + parts[-1]
              path = "assets/fonts/" + fname
              if not os.path.exists(path):
                  urllib.request.urlretrieve(url, path)
              return "url('" + fname + "')"
          css = re.sub(r"url\((https://fonts\.gstatic\.com/[^)]+)\)", repl, css)
          open("assets/fonts/fonts.css", "w").write(css)
          print("files:", len(os.listdir("assets/fonts")))
          EOF
          ls -la assets/fonts | head -30

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fonts
          git commit -m "Vendor Google Fonts locally (woff2 + local CSS)"
          git push origin claude/parasha-website-kjw9xa
