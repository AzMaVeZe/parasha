name = "parasha-newsletter"
main = "src/index.js"
compatibility_date = "2024-11-01"

# --- משתנים גלויים (לא סודות) ---
[vars]
SITE_URL   = "https://parasha.azma.app"
BRAND      = "בין הנכתב לנגלה"
# כתובת השליחה — בדומיין שאומת ב-Resend:
FROM_EMAIL = "פרשת השבוע <parasha@azma.app>"
REPLY_TO   = ""
# הכתובת של ה-Worker עצמו (משמשת לקישורי אישור והסרה במיילים):
WORKER_URL = "https://parasha-newsletter.azma.workers.dev"

# --- אחסון הנרשמים ---
# ליצור עם:  npx wrangler kv namespace create SUBSCRIBERS
# ואז להדביק כאן את ה-id שהתקבל:
[[kv_namespaces]]
binding = "SUBSCRIBERS"
id = "e88e26054d6e46c3a318e284f6a9fdfb"

# --- תזמון: שני, חמישי ושישי בבוקר ---
# הזמן ב-UTC: 04:00 UTC = 07:00 בשעון קיץ ישראלי, 06:00 בשעון חורף.
# כל cron רץ פעם אחת ביומו; ה-Worker שולח רק לנרשמים שבחרו את אותו יום.
[triggers]
crons = ["0 4 * * 1", "0 4 * * 4", "0 4 * * 5"]

# --- סודות (לא נשמרים בקובץ הזה!) ---
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put ADMIN_KEY
